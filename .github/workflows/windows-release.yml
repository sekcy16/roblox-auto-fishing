name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            executable: RobloxAutoFishing-v0.0.3.exe
          - os: ubuntu-latest
            platform: Linux
            executable: RobloxAutoFishing-v0.0.3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"
      - name: Run tests
        if: runner.os == 'Windows'
        run: python -m unittest test_auto_fishing test_desktop_control tests.test_ui_redesign -v
      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest test_auto_fishing test_desktop_control tests.test_ui_redesign -v
      - name: Build executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RobloxAutoFishing-v0.0.3 --version-file windows-version-info.txt auto_fishing.py
      - name: Build executable
        if: runner.os == 'Linux'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RobloxAutoFishing-v0.0.3 auto_fishing.py
      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/RobloxAutoFishing-v0.0.3-Windows
          Copy-Item dist/${{ matrix.executable }} release/RobloxAutoFishing-v0.0.3-Windows/
          Copy-Item WINDOWS-README.txt release/RobloxAutoFishing-v0.0.3-Windows/
          Compress-Archive -Force release/RobloxAutoFishing-v0.0.3-Windows/* release/RobloxAutoFishing-v0.0.3-Windows.zip
      - name: Create Linux ZIP
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/RobloxAutoFishing-v0.0.3-Linux
          cp dist/${{ matrix.executable }} README.md release/RobloxAutoFishing-v0.0.3-Linux/
          chmod +x release/RobloxAutoFishing-v0.0.3-Linux/${{ matrix.executable }}
          cd release && zip -r RobloxAutoFishing-v0.0.3-Linux.zip RobloxAutoFishing-v0.0.3-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: RobloxAutoFishing-v0.0.3-${{ matrix.platform }}
          path: release/RobloxAutoFishing-v0.0.3-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RobloxAutoFishing-v0.0.3-*
          merge-multiple: true
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "Roblox Auto Fishing 0.0.3" --notes "ปรับ UI ให้เข้าใจง่ายขึ้น เพิ่ม Live Preview และกรอบบอกพื้นที่ขณะลาก พร้อมปรับการติดตามช่องม่วงขนาดเล็ก ดาวน์โหลด ZIP ให้ตรงกับ Windows หรือ Linux"
